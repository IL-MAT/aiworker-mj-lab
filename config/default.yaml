# FFW-SH5 실행 및 알고리즘 조절값의 기본 설정이다.
# 단위는 키 이름 또는 각 항목의 주석에 표시한다.
schema_version: 5

application:
  # 실행할 MJCF 모델과 초기 키프레임이다. 상대 경로는 저장소 루트를 기준으로 한다.
  model_path: models/full_scene.xml
  home_keyframe: home
  window:
    width: 1440
    height: 900
  # 화면 한 프레임에서 제어 명령을 갱신하는 빈도다. macOS operator view는
  # visual-only LOD mesh를 사용해 이 30 Hz 주기를 유지한다.
  loop_hz: 30.0
  # 양팔의 기본 관절 자세다. 순서는 1번 관절부터 7번 관절까지이며 단위는 rad이다.
  home_arm_position_rad: [0.0, 0.0, 0.0, -1.5707963267948966, 0.0, 0.0, 0.0]
  # 리프트 목표 범위와 키보드 조그 속도다.
  lift_range_m: [-0.5, 0.0]
  lift_jog_speed_m_s: 0.3
  # 양손 가상 물체 마커의 초기 월드 위치다.
  virtual_object_home_position_m: [0.4055, 0.0, 0.9716]
  # 슬라이더가 급변할 때 프레임마다 허용하는 최대 목표 변화량이다.
  max_position_step_per_frame_m: 0.03
  max_rotation_step_per_frame_deg: 8.0
  # 원터치 파지 명령이 0에서 1까지 변하는 초당 변화량이다.
  grasp_command_rate_per_s: 1.0
  # 수동 주행 해제 후 정지로 판정하는 차체 속도 임계값이다.
  manual_stop_linear_speed_m_s: 0.01
  manual_stop_angular_speed_rad_s: 0.02

arm_control:
  # 팔 motor 액추에이터의 소프트웨어 PD 이득이다.
  proportional_gain: 600.0
  derivative_gain: 40.0

whole_body_ik:
  # 실행 중 UI에서도 바꿀 수 있는 differential IK 해법과 수치 파라미터다.
  solver:
    method: qp
    pseudoinverse_rcond: 0.000001
    dls_damping: 0.05
  # 아래 task weight는 모두 속도 상한으로 정규화한 무차원 strength다.
  # 위치는 m/s, 방향은 rad/s 잔차를 각각의 task 속도 상한으로 나눈 뒤 적용한다.
  position_weight: 14.4
  orientation_weight: 45.0
  position_gain: 10.0
  orientation_gain: 9.0
  posture_gain: 1.0
  # 관절 한계 CBF 설정이다.
  joint_limit_margin_rad: 0.02
  joint_limit_gain: 5.0
  # 양손 상대 자세를 유지하는 위치·방향 task의 무차원 strength다.
  rigid_grasp_weights:
    position: 360.0
    orientation: 2250.0
  # 충돌 거리 CBF 설정이다. buffer는 safe_distance보다 커야 한다.
  collision_avoidance: true
  collision_buffer_m: 0.03
  collision_safe_distance_m: 0.01
  collision_barrier_gain: 50.0
  # CBF 위반 속도를 최대 task 선속도로 나눈 무차원 slack의 비용이다.
  collision_slack_weight: 1000.0
  # 말단과 베이스 명령의 속도·가속도 상한이다.
  max_task_linear_speed_m_s: 1.2
  max_task_angular_speed_rad_s: 3.0
  base_linear_acceleration_limit_m_s2: 8.0
  base_angular_acceleration_limit_rad_s2: 4.0
  base_position_fade_distance_m: 0.08
  base_orientation_fade_angle_rad: 0.25
  # 모바일 베이스의 전신 QP 참여율이다. 1은 전부 참여, 0.05는 거의 고정,
  # 0은 베이스 3축만 정확히 고정하며 lift와 양팔은 계속 푼다.
  base:
    participation_scale: 1.0
  # 좌우 평면 이동과 각 팔 관절은 각각 하나의 공통 속도 상한을 사용한다.
  velocity_limits:
    base_linear: 0.55
    base_yaw: 1.4
    lift: 0.35
    arm: 4.5
  # 속도 상한으로 정규화한 무차원 QP 정규화 강도다.
  # 실제 비용은 strength * (속도 / 속도 상한)^2이며 값이 클수록 움직임이 비싸다.
  damping_weights:
    base_linear: 0.075625
    base_yaw: 0.392
    lift: 0.0147
    arm: 0.91125
  # 자세 복귀 속도도 속도 상한으로 정규화하며 base에는 기준 자세를 두지 않는다.
  posture_weights:
    lift: 0.01225
    arm: 0.50625
  # 양손 공통 이동을 베이스 명령으로 바꾸는 서보 설정이다.
  common_base:
    position_gain: 5.0
    yaw_gain: 3.5
    yaw_deadband_rad: 0.05
    # base x/y/yaw 속도를 각 축의 속도 상한으로 나눈 무차원 task strength다.
    task_weights:
      translation: 9.075
      yaw: 196.0

base:
  teleop:
    # 키보드 병진·회전 목표와 평활화 이득이다.
    cruise_speed_m_s: 0.62
    max_speed_m_s: 0.70
    acceleration_gain: 5.0
    brake_gain: 8.0
    yaw_speed_rad_s: 1.6
    yaw_follow_gain: 5.0
    yaw_decay_gain: 8.0
  geometry:
    # 각 스워브 모듈의 차체 기준 (x, y) 위치다.
    wheel_positions_m:
      left_wheel: [0.1371, 0.2554]
      right_wheel: [0.1371, -0.2554]
      rear_wheel: [-0.2899, 0.0]
    wheel_radius_m: 0.09
    steering_range_rad: [-6.28, 6.28]
    module_angle_offsets_rad:
      left_wheel: 0.0
      right_wheel: 0.0
      rear_wheel: 0.0
    wheel_speed_limit_rad_s: [-50.0, 50.0]
  control:
    linear_velocity_deadband_m_s: 0.001
    angular_velocity_deadband_rad_s: 0.001
    steering_velocity_limit_rad_s: 8.0
    alignment_angle_threshold_rad: 0.10
    alignment_start_speed_threshold_rad_s: 0.10
    steering_tolerance_rad: 0.03
    direction_switch_hysteresis_rad: 0.08
    reversal_deceleration_rate: 7.0
    reversal_acceleration_rate: 5.0
    reversal_threshold: 0.05
    drive_acceleration_limit_rad_s2: 80.0
    drive_brake_limit_rad_s2: 3.0
    drive_creep_threshold_rad_s: 0.5
    drive_creep_brake_limit_rad_s2: 0.20

grasp:
  # 손가락 관절 범위에서 열림과 최대 굽힘이 차지하는 비율이다.
  finger_open_fraction: 0.20
  thumb_open_fraction: 0.0
  ring_pinky_max_fraction: 0.35
  # 엄지 CMC 사전 자세와 MCP yaw의 휴식·굽힘 각도다.
  thumb_preshape_rad:
    left: -0.131
    right: -0.131
  thumb_yaw_rest_rad:
    left: 1.309
    right: -1.309
  thumb_yaw_curl_rad:
    left: 2.0326
    right: -2.0326
  # 접촉력 기반 파지 판정의 기본 임계값이다.
  detection:
    minimum_fingers: 2
    minimum_total_force_n: 0.05
    require_thumb: true

ui:
  jog_position_step_m: 0.005
  jog_rotation_step_deg: 2.0
  windows:
    control:
      title: FFW-SH5 Control Center
      position: [575, 10]
      size: [470, 720]
      visible: true
    diagnostics:
      title: FFW-SH5 Diagnostics
      position: [10, 295]
      size: [650, 390]
      visible: true

render:
  # 두 카메라 프리셋은 lookat, 거리, 방위각, 고도각 순으로 구성한다.
  camera_presets:
    overview:
      lookat: [0.3, 0.0, 1.0]
      distance: 2.2
      azimuth_deg: 120.0
      elevation_deg: -20.0
    hand_closeup:
      lookat: [0.5055, 0.0, 0.85]
      distance: 0.5
      azimuth_deg: 90.0
      elevation_deg: -15.0
    shelf_sort:
      lookat: [0.50, 0.0, 0.72]
      distance: 3.0
      azimuth_deg: 25.0
      elevation_deg: -32.0

# ROS/whole-body 경로와 분리된 ALOHA-style imitation 환경 설정이다.
imitation:
  control_hz: 25.0
  policy:
    # task-space ACT 출력을 오른팔 IK로 변환할 때만 pose 서보 gain에 곱한다.
    # 관절 속도·관절 범위·충돌 CBF 상한은 바꾸지 않는다.
    task_ik_speed_scale: 3.0
    # 0은 기존 ACT temporal ensemble, 양수는 그만큼 미래 action을 당겨 쓰는 PTE다.
    pte_steps: 0
    # 정책 제어는 25 Hz를 유지하고 Rerun만 이 주기로 샘플링해 Viewer 병목을 막는다.
    rerun_log_hz: 5.0
  teleop:
    # DLS IK의 task-space 추종 감도와 최대 속도다. 관절 속도는
    # FFW-SH5 follower URDF의 arm joint 한계인 4.8 rad/s를 넘지 않는다.
    position_gain: 12.0
    orientation_gain: 9.0
    max_linear_speed_m_s: 1.0
    max_angular_speed_rad_s: 3.0
    max_joint_speed_rad_s: 4.8
  # ZED-M extrinsic은 원본 브라켓 방향을 바꾸지 않고, 실제 목 관절을
  # 아래로 꺽어 작업대를 본다. joint1의 양의 방향이 아래쪽 pitch이다.
  head_fixed_position_rad: [0.6951, 0.0]
  # can-to-box v1은 오른팔만 조작한다. 왼손은 작업공간 밖에서 손바닥(+X local)이
  # 월드 +Z를 향하는 자세로 고정한다. 16D dataset 계약의 왼쪽 값은 이 상수다.
  left_arm_fixed: true
  left_arm_park_position_rad: [1.1637, 0.0578, -0.1048, -2.3003, 1.544, -0.1166, -0.4358]
  left_grasp_fixed: 0.0
  camera:
    # 수집은 세 시점을 모두 저장하고 ACT config의 camera_names에서 필요한 것만 고른다.
    names: [cam_high, cam_left_wrist, cam_right_wrist]
    width: 320
    height: 240
  reset:
    # 캔은 파란 상자 중심(target site)에서 로봇 쪽(-Y)으로 18 cm
    # 떨어진 지점 옆에 배치한다. 임의 오차는 반지름 5 cm 원 안의
    # 균일 분포이며, 최악의 경우에도 캔과 상자 벽이 겹치지 않는다.
    can_anchor_offset_from_target_xy_m: [0.0, -0.18]
    can_spawn_jitter_radius_m: 0.05
    can_z_m: 0.7866
  task:
    target_site: target_bin_center
    inner_half_extents_m: [0.075, 0.075]
    success_height_range_m: [0.76, 0.86]
    settle_speed_m_s: 0.08
  scenarios:
    shelf_color_sort:
      # 로봇 기준 +X 전방의 3단 선반 중간 단에서 캔을 집는다. +Y 왼쪽 테이블에는
      # 빨강 박스, -Y 오른쪽 테이블에는 파랑 박스가 있다.
      spawn_site: source_shelf_middle_spawn
      spawn_jitter_radius_m: 0.04
      can_z_m: 0.835
      variant_names: [red, blue]
      variant_materials: [can_red_sort_mat, can_green_sort_mat]
      variant_cap_materials: [can_red_sort_mat, can_green_sort_mat]
      target_sites: [target_bin_red_center, target_bin_center]
      target_labels: [red, blue]
      variant_rgba:
        - [0.86, 0.06, 0.06, 1.0]
        - [0.04, 0.24, 0.92, 1.0]
      # 로봇 기준 왼쪽(+Y)은 빨강, 오른쪽(-Y)은 파랑 박스다. 두 테이블 사이에는
      # 폭 0.62 m인 모바일 베이스가 좌우 4 cm 여유로 들어가는 0.70 m 통로를 둔다.
      bin_bodies: [target_bin_red, target_bin]
      bin_positions_m: [[0.39, 0.62, 0.7125], [0.39, -0.62, 0.7125]]
      # 기존 높이는 유지하고 상자 바닥의 가로·세로만 28 cm로 넓힌다.
      bin_outer_half_extent_m: 0.14
      success_inner_half_extents_m: [0.13, 0.13]
      fixture_bodies: [source_shelf, side_table_red, side_table_blue]
    can_color_sort:
      # 캔 색과 무관한 공통 영역에서 respawn하여 시작 위치가 정답 상자를 누설하지 않는다.
      # 기준점은 최초 배치보다 상자 쪽으로 10 cm 밀어 두 상자 사이에 둔다.
      spawn_site: can_color_sort_spawn
      spawn_jitter_radius_m: 0.05
      can_z_m: 0.7866
      # 차가운 green/blue 캔은 파랑 상자, 따뜻한 red/orange 캔은 빨강 상자로 분류한다.
      variant_names: [green, red, orange, blue]
      # 전용 material 두 개의 RGBA만 runtime에서 바꿔 MJCF/model_hash는 유지한다.
      variant_materials: [can_green_sort_mat, can_red_sort_mat, can_red_sort_mat, can_green_sort_mat]
      variant_cap_materials: [can_green_sort_mat, can_red_sort_mat, can_red_sort_mat, can_green_sort_mat]
      target_sites: [target_bin_center, target_bin_red_center, target_bin_red_center, target_bin_center]
      target_labels: [blue, red, red, blue]
      variant_rgba:
        - [0.08, 0.62, 0.14, 1.0]
        - [0.82, 0.08, 0.08, 1.0]
        - [0.95, 0.38, 0.03, 1.0]
        - [0.05, 0.30, 0.90, 1.0]
      bin_bodies: [target_bin, target_bin_red]
      # 로봇 정면에서 파랑은 왼쪽(-Y), 빨강은 오른쪽(+Y)에 같은 깊이로 둔다.
      # 두 상자의 중점은 Y=-0.05다. 로봇 베이스는 기존 제어 기준을 유지하면서
      # 작업공간 중앙의 반대편(+Y, 화면 기준 왼쪽)에 위치한다.
      # 순서는 위 bin_bodies와 같으므로 blue, red 순서다.
      bin_positions_m: [[0.5355, -0.27, 0.7391], [0.5355, 0.17, 0.7391]]
      # 테이블을 좌우로 20 cm, 깊이로 8 cm 넓혀 planning 여유를 확보한다.
      table_position_y_m: -0.05
      table_half_width_x_m: 0.30
      table_half_width_y_m: 0.35
      # 기존 벽 half-height 0.08 m의 2/3. floor와 맞닿는 벽 하단은 유지한다.
      bin_wall_half_height_m: 0.05333333333333334
      # 기존 home pose와 자세(quaternion)는 유지하고 오른쪽 EE만 +Z 10 cm 올린 IK 해다.
      right_arm_start_position_rad: [-0.0381287163, -0.2902937754, 0.1700398805, -1.9341540186, -0.3104451628, 0.3364858776, -0.2716638607]
